# Sparkle Connect — Render Deployment Configuration
# Two services: root static HTML (zero-build) and React SPA (from apps/web/dist)

services:
  # ─── 1. Zero-build standalone HTML site (root index.html) ─────────────────
  - type: web
    name: sparkle-connect-static
    env: static
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildCommand: ""
    buildFilter:
      paths:
        - index.html

  # ─── 2. React SPA (apps/web) — Vite build ─────────────────────────────────
  - type: web
    name: sparkle-connect-app
    env: static
    rootDir: apps/web
    # Run the package build script so TypeScript errors fail deployment instead
    # of being hidden by invoking Vite directly.
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
